<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none';" />
  <title>Quick Capture</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="capture-body">
  <div class="capture-shell">
    <div class="capture-drag-bar">
      <strong class="capture-title">Quick Capture to Second Brain</strong>
      <div class="capture-header-right">
        <span class="kbd" id="qcShortcutHint">Ctrl+Enter save · Esc close</span>
        <button class="btn sm no-drag" id="qcCloseTop" type="button" title="Close (Esc)">×</button>
      </div>
    </div>
    <div id="qcStatus" class="status-banner no-drag" style="display:none; padding:6px 10px;"></div>
    <div class="capture-row no-drag">
      <select id="qcDestination" class="no-drag" style="width:230px;" aria-label="Destination">
        <option value="notes">Working Note (brain/notes/)</option>
        <option value="inbox">Quarantined Inbox (0-raw/inbox/)</option>
      </select>
      <input type="text" id="qcTags" class="no-drag" placeholder="Tags (comma-separated, e.g. quick-capture)" style="flex:1;" />
    </div>
    <input type="text" id="qcTitle" class="no-drag" placeholder="Optional title..." />
    <textarea id="qcBody" class="no-drag" placeholder="Capture a thought, snippet, or decision... (Ctrl+Enter to save)" style="flex:1; resize:none;"></textarea>
    <div class="capture-footer no-drag">
      <button class="btn no-drag" id="qcCancel" type="button">Cancel</button>
      <button class="btn primary no-drag" id="qcSave" type="button">Save Note</button>
    </div>
  </div>
  <script src="capture.js"></script>
</body>
</html>
