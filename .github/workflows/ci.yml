name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    # Fork/PR builds always execute on GitHub-hosted runners; optional SB_*_RUNNER overrides apply only to trusted push/dispatch runs.
    runs-on: ${{ (github.event_name != 'pull_request' && ((matrix.os == 'windows-latest' && vars.SB_WINDOWS_RUNNER) || (matrix.os == 'macos-latest' && vars.SB_MACOS_RUNNER) || (matrix.os == 'ubuntu-latest' && vars.SB_LINUX_RUNNER))) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            skip_gui_pack: true
          - os: ubuntu-latest
            python-version: "3.13"
            skip_gui_pack: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux headless GUI & Electron dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }} & sync environment
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --python ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate multi-platform icons
        run: uv run --frozen python scripts/make_icons.py

      - name: Verify POSIX shell scripts & plugin templates use LF line endings
        shell: bash
        run: |
          uv run --frozen python -c '
          from pathlib import Path
          import sys
          targets = [
              Path("setup.sh"),
              Path("run_daemon.sh"),
              Path("run_dashboard.sh"),
              Path("run_night_shift.sh"),
              Path("scripts/package_desktop.sh"),
              *sorted(p for p in Path("plugins").rglob("*") if p.is_file()),
          ]
          bad = [str(p) for p in targets if p.exists() and b"\r" in p.read_bytes()]
          if bad:
              print("CRLF detected in LF-required files:", bad, file=sys.stderr)
              sys.exit(1)
          '

      - name: Initialize isolated CI vault & run all Python unit, contract, doctor, scale & AppTest suites
        shell: bash
        env:
          BRAIN_CI_CODE_ONLY: "1"
        run: |
          export BRAIN_VAULT_DIR="${RUNNER_TEMP}/sb-ci-vault"
          uv run --frozen second-brain install
          # Ollama, ONNX weights, faster-whisper, PyAV, and Pillow are optional.
          # live_runtime_integration_tests skips those cases when the dependency is
          # absent. Set BRAIN_REQUIRE_OLLAMA=1 (or BRAIN_REQUIRE_ONNX / WHISPER / PYAV / PILLOW)
          # only on a runner that actually has them.
          # --exclude skips only the separately-orchestrated GUI/VSIX/wheel steps below so all suites
          # (including doctor, goal4_sync_and_ui_tests, bugfix_1a_regression_tests, parity_1c_tests,
          # phase6_release_and_stores_tests, and scale_benchmark_1500) run automatically.
          uv run --frozen python scripts/test_all.py --fail-fast \
            --exclude desktop_ui_tests vscode_extension_tests wheel_packaging_tests

      - name: Build wheel & run isolated clean-wheel venv tests
        run: |
          uv build --out-dir dist
          uv run --frozen python -m unittest scripts.wheel_packaging_tests -v

      - name: Build offline wheelhouse, VS Code VSIX, Browser Web Clipper MV3 & Mobile PWA
        run: |
          uv run --frozen python scripts/build_wheelhouse.py --out-dir dist/wheelhouse --strict-lock-downloads
          uv run --frozen python scripts/build_vsix.py --out-dir dist
          uv run --frozen python scripts/build_clipper.py --out-dir dist
          uv run --frozen python scripts/build_distribution_manifests.py --pwa-only --out-dir dist

      - name: Run VS Code extension tests (zero-dependency Node test runner)
        if: ${{ !matrix.skip_gui_pack }}
        shell: bash
        run: |
          if [ -f extensions/vscode-second-brain/package-lock.json ]; then
            (cd extensions/vscode-second-brain && npm ci --ignore-scripts)
          fi
          uv run --frozen python scripts/run_vscode_tests.py

      - name: Run Electron desktop tests, unpacked directory build & packaged --smoke-test
        if: ${{ !matrix.skip_gui_pack }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          (
            cd desktop
            npm ci
            if node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts.test ? 0 : 1)'; then
              if [ "${RUNNER_OS}" = "Linux" ]; then
                xvfb-run -a npm test
              else
                npm test
              fi
            fi
            npx electron-builder --dir --publish never
          )
          uv run --frozen python scripts/run_desktop_tests.py --require-packaged --skip-unit
