[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "1.0.0"
description = "A local-first, evidence-grounded memory core for AI hosts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "httpcore>=1,<2",
    "filelock>=3.12,<4",
    "pydantic>=2.7,<3",
    "rich>=13,<15",
    "beautifulsoup4>=4.13,<5",
    "pypdf>=5,<7",
    "PyYAML>=6.0,<7",
    "cryptography>=42,<51",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.66,<2", "plotly>=6,<7", "networkx>=3.4,<4", "pandas>=2.2,<3", "ollama>=0.6,<1"]
online = ["ollama>=0.6,<1", "chromadb>=1.0,<2", "rich>=13,<15"]
dense = ["chromadb>=1.0,<2", "ollama>=0.6,<1"]
mcp = ["mcp>=2.3,<3", "ollama>=0.6,<1"]
scout = ["httpx>=0.28,<1", "httpcore>=1,<2", "trafilatura>=2,<3", "beautifulsoup4>=4.13,<5"]
watchdog = ["watchdog>=6,<7"]
evaluation = ["ollama>=0.6,<1", "chromadb>=1.0,<2"]
multimodal = ["faster-whisper>=1.1,<2", "Pillow>=11,<13"]
reranker = ["onnxruntime>=1.19,<2", "tokenizers>=0.20,<1", "numpy>=1.26,<3"]
dev = []
all = [
    "chromadb>=1.0,<2",
    "onnxruntime>=1.19,<2",
    "tokenizers>=0.20,<1",
    "numpy>=1.26,<3",
    "streamlit>=1.66,<2",
    "plotly>=6,<7",
    "networkx>=3.4,<4",
    "pandas>=2.2,<3",
    "ollama>=0.6,<1",
    "mcp>=2.3,<3",
    "trafilatura>=2,<3",
    "watchdog>=6,<7",
    "faster-whisper>=1.1,<2",
    "Pillow>=11,<13",
]

[dependency-groups]
dev = [
    "chromadb>=1.0,<2",
    "onnxruntime>=1.19,<2",
    "tokenizers>=0.20,<1",
    "numpy>=1.26,<3",
    "streamlit>=1.66,<2",
    "plotly>=6,<7",
    "networkx>=3.4,<4",
    "pandas>=2.2,<3",
    "ollama>=0.6,<1",
    "mcp>=2.3,<3",
    "trafilatura>=2,<3",
    "watchdog>=6,<7",
    "faster-whisper>=1.1,<2",
    "Pillow>=11,<13",
]

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["second_brain"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "second_brain/scripts"
"dashboard" = "second_brain/dashboard"
"plugins" = "second_brain/plugins"
"mobile" = "second_brain/mobile"
".streamlit/config.toml" = "second_brain/_streamlit/config.toml"

[tool.uv]
default-groups = ["dev"]
