[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "1.0.0"
description = "A local-first, evidence-grounded memory core for AI hosts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "httpcore>=1,<2",
    "filelock>=3.12,<4",
    "pydantic>=2.7,<3",
    "rich>=13,<15",
    "beautifulsoup4>=4.13,<5",
    "pypdf>=5,<7",
    "PyYAML>=6.0,<7",
    "cryptography>=42,<49",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.66,<2", "plotly>=6,<7", "networkx>=3.4,<4", "pandas>=2.2,<3", "ollama>=0.6,<1"]
online = ["ollama>=0.6,<1", "chromadb>=1.0,<2", "rich>=13,<15"]
dense = ["chromadb>=1.0,<2", "ollama>=0.6,<1"]
mcp = ["mcp>=2.3,<3", "ollama>=0.6,<1"]
scout = ["httpx>=0.28,<1", "httpcore>=1,<2", "trafilatura>=2,<3", "beautifulsoup4>=4.13,<5"]
watchdog = ["watchdog>=6,<7"]
evaluation = ["ollama>=0.6,<1", "chromadb>=1.0,<2"]
multimodal = ["av>=12,<19", "faster-whisper>=1.1,<2", "Pillow>=11,<13"]
reranker = ["onnxruntime>=1.19,<2", "tokenizers>=0.20,<1", "numpy>=1.26,<3"]
creative = [
    "accelerate>=0.30,<2",
    "av>=12,<19",
    "diffusers>=0.30,<1",
    "safetensors>=0.4,<1",
    "torch>=2.2,<3",
    "transformers>=4.40,<6",
]
math = ["sympy>=1.13,<2", "z3-solver>=4.13,<5"]
dev = []
all = [
    "av>=12,<19",
    "chromadb>=1.0,<2",
    "onnxruntime>=1.19,<2",
    "tokenizers>=0.20,<1",
    "numpy>=1.26,<3",
    "streamlit>=1.66,<2",
    "plotly>=6,<7",
    "networkx>=3.4,<4",
    "pandas>=2.2,<3",
    "ollama>=0.6,<1",
    "mcp>=2.3,<3",
    "trafilatura>=2,<3",
    "watchdog>=6,<7",
    "faster-whisper>=1.1,<2",
    "Pillow>=11,<13",
]

[dependency-groups]
dev = [
    "av>=12,<19",
    "chromadb>=1.0,<2",
    "onnxruntime>=1.19,<2",
    "tokenizers>=0.20,<1",
    "numpy>=1.26,<3",
    "streamlit>=1.66,<2",
    "plotly>=6,<7",
    "networkx>=3.4,<4",
    "pandas>=2.2,<3",
    "ollama>=0.6,<1",
    "mcp>=2.3,<3",
    "trafilatura>=2,<3",
    "watchdog>=6,<7",
    "faster-whisper>=1.1,<2",
    "Pillow>=11,<13",
]

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["second_brain"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/_hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "brain/**",
    "dist/**",
    "tmp/**",
    "release-artifacts/**",
    "merged-dist/**",
    "pypi-dist/**",
    "release-manifests/**",
    ".venv/**",
    ".agents/**",
    "**/node_modules/**",
    "**/__pycache__",
    "**/*.pyc",
    ".env*",
    "**/.env*",
    "*.pfx",
    "*.p12",
    "*.pem",
    "*.key",
    "*.jks",
    "*.keystore",
    "*.p8",
    "*.sbvault",
    "**/local.properties",
    "**/google-services.json",
    "**/play-key.json",
    "**/.gradle/**",
    "**/Pods/**",
    "**/DerivedData/**",
    "**/build/**",
]

[tool.uv]
default-groups = ["dev"]
