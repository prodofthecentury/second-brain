[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "0.1.0"
description = "A local-first, evidence-grounded memory core for AI hosts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.0,<2",
    "streamlit>=1.66,<2",
    "httpx>=0.28,<1",
    "httpcore>=1,<2",
    "trafilatura>=2,<3",
    "ollama>=0.6,<1",
    "mcp>=2.3,<3",
    "plotly>=6,<7",
    "networkx>=3.4,<4",
    "pandas>=2.2,<3",
    "beautifulsoup4>=4.13,<5",
    "watchdog>=6,<7",
    "filelock>=3.12,<4",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
multimodal = ["faster-whisper>=1.1,<2", "Pillow>=11,<13"]
all = [
    "faster-whisper>=1.1,<2",
    "Pillow>=11,<13",
]

[project.scripts]
second-brain = "scripts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "dashboard"]
only-include = ["scripts", "dashboard"]

[tool.uv]
default-groups = []
